<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Hi My Princess 🩷</title>

    <link rel="stylesheet" href="css/heart.css">
</head>

<body>

    <!-- Paper texture -->
    <div class="paper-texture"></div>

    <!-- Soft background glow -->
    <div class="background-glow"></div>

    <!-- Decorative hearts -->
    <div class="edge-decoration right-decoration">
        <span>♥</span>
        <span>♥</span>
        <span>♥</span>
        <span>♥</span>
        <span>♥</span>
    </div>

    <div class="edge-decoration left-decoration">
        <span>♥</span>
        <span>♥</span>
        <span>♥</span>
    </div>

    <!-- Top handwritten heart -->
    <div class="corner-love">
        ♡
    </div>

    <!-- Main heart -->
    <canvas id="heartCanvas"></canvas>

    <!-- Text inside heart -->
    <div id="message">
        <span>Hi My</span>
        <span>Princess 🩷</span>
    </div>

    <!-- Sparkles -->
    <div id="sparkles"></div>

    <!-- Bottom decorations -->
    <div class="bottom-left-decoration">

        <div class="favorite-small">
            you are my
        </div>

        <div class="favorite-big">
            favorite
        </div>

        <div class="favorite-script">
            person
        </div>

    </div>

    <div class="fingerprint-heart">
        ♡
    </div>

    <div class="flower">
        🌺
    </div>

    <!-- Music -->

    <audio id="bgMusic" loop preload="auto">
        <source src="assets/audio/love.mp3" type="audio/mpeg">
    </audio>

    <button
        id="musicButton"
        type="button"
        aria-label="Play or pause music"
    >
        ♫
    </button>


    <script src="js/heart.js"></script>

</body>

</html>
