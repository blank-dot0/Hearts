<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Hi My Princess 🩷
</title>


<link rel="stylesheet" href="css/heart.css">
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playball&display=swap" rel="stylesheet">

</head>


<body>


<!-- Romantic paper background layers -->

<div class="paper-bg"></div>


<div class="paper-decoration top-heart">
    ♡
</div>


<div class="paper-decoration side-hearts">
    ♥
    ♥
    ♥
</div>



<!-- Newspaper style corner -->

<div class="paper-corner">

    <div>
        you are my
        <br>

        <strong>
        favorite
        </strong>

        <br>

        person

    </div>

</div>



<!-- Flower decoration -->

<div class="flower-decoration">

🌺

</div>




<!-- Particle canvas -->

<canvas id="heartCanvas"></canvas>




<!-- Message -->

<div id="heartMessage">

    Hi My

    <br>

    Princess 🩷

</div>




<!-- Floating effects -->

<div id="floatingHearts"></div>

<div id="sparkles"></div>


<!-- Falling petals -->

<div id="petalContainer"></div>




<!-- Music -->

<audio id="bgMusic" loop>

<source 
src="assets/audio/love.mp3"
type="audio/mpeg">

</audio>



<button id="musicButton">

♪ Music

</button>




<script src="js/heart.js"></script>


</body>

</html>
