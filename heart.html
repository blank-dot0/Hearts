 <!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>For My Princess ❤️</title>

    <link rel="stylesheet" href="css/heart.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet"
    >
</head>

<body>

    <!-- Paper texture -->
    <div class="paper-texture"></div>


    <!-- Decorative top-right heart -->
    <div class="top-decoration">
        <div class="drawn-heart">♡</div>
        <div class="small-heart">♥</div>
    </div>


    <!-- Side hearts -->
    <div class="side-hearts">
        <span>♥</span>
        <span>♥</span>
        <span>♥</span>
        <span>♥</span>
        <span>♥</span>
    </div>


    <!-- Floating background hearts -->
    <div id="floatingHearts"></div>


    <!-- Sparkles -->
    <div id="sparkles"></div>


    <!-- MAIN HEART -->
    <main class="heart-section">

        <canvas id="heartCanvas"></canvas>

        <div id="heartMessage">
            <span>Hi My</span>
            <span>Princess</span>
            <span class="message-heart">♥</span>
        </div>

        <div class="heart-shadow"></div>

    </main>


    <!-- Bottom left collage -->
    <div class="bottom-collage">

        <div class="newspaper"></div>

        <div class="favorite-text">
            <small>you are my</small>
            <strong>favorite</strong>
            <em>person</em>
        </div>

    </div>


    <!-- Bottom right decoration -->
    <div class="bottom-right">

        <div class="fingerprint-heart">
            ♡
        </div>

        <div class="flower">
            🌺
        </div>

    </div>


    <!-- Music -->
    <audio id="bgMusic" loop>
        <source src="assets/audio/love.mp3" type="audio/mpeg">
    </audio>

    <button id="musicButton" aria-label="Play music">
        ♪
        <span>Music</span>
    </button>


    <script src="js/heart.js"></script>
 <div id="petalContainer"></div>

</body>
</html>
