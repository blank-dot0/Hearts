<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta 
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>
        Hi My Princess 🩷
    </title>


    <link rel="stylesheet" href="css/heart.css">

</head>


<body>


<!-- Soft paper background -->

<div class="paper-background"></div>


<!-- Light glow -->

<div class="romantic-glow"></div>



<!-- Floating hearts -->

<div id="floatingHearts"></div>



<!-- Sparkles -->

<div id="sparkles"></div>



<!-- Falling petals -->

<div id="petalContainer"></div>



<!-- Heart animation -->

<canvas id="heartCanvas"></canvas>




<!-- Message -->

<div id="heartMessage">

    <span>
        Hi My
    </span>

    <span>
        Princess 🩷
    </span>

</div>




<!-- Music -->

<audio 
    id="bgMusic"
    loop
    preload="auto"
>

    <source 
        src="assets/audio/love.mp3"
        type="audio/mpeg"
    >

</audio>



<button 
    id="musicButton"
>

    ♪ Music

</button>





<script src="js/heart.js"></script>


</body>

</html>
